apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanilla-wow-server
  namespace: __NAMESPACE__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vanilla-wow-server
  template:
    metadata:
      labels:
        app: vanilla-wow-server
    spec:
      # hostNetwork so the client-hardcoded realm port (3724) and the world
      # port are reachable at their real values on the node's LAN IP without
      # a LoadBalancer controller. ClusterFirstWithHostNet keeps in-cluster
      # DNS (the mariadb Service) resolvable despite hostNetwork.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: vanilla-wow-server
          image: __IMAGE_TAG__
          # IfNotPresent: the image is built locally (build-image) and, on
          # kind, side-loaded with 'kind load' — it isn't in any registry.
          # The default for a :latest tag is Always, which makes kubelet try
          # to pull from Docker Hub and fail (ImagePullBackOff).
          imagePullPolicy: IfNotPresent
          # stdin: true — mangosd/realmd treat EOF on their console stdin as
          # an implicit quit. entrypoint.sh already guards against that on
          # its own (process substitution for realmd, a held-open FIFO for
          # mangosd), so this isn't what keeps the server up; it only keeps
          # the container's own stdin attachable ('kubectl attach -i').
          stdin: true
          ports:
            - containerPort: __REALM_PORT__
              hostPort: __REALM_PORT__
              protocol: TCP
            - containerPort: __WORLD_PORT__
              hostPort: __WORLD_PORT__
              protocol: TCP
          volumeMounts:
            - name: conf
              mountPath: /app/etc
              readOnly: true
            - name: game-data
              mountPath: /app/data
              readOnly: true
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: conf
          configMap:
            name: vanilla-wow-conf
        - name: logs
          emptyDir: {}
        - name: game-data
          __DATA_SOURCE__

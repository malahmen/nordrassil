apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanilla-wow-mariadb
  namespace: __NAMESPACE__
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data directory is a single hostPath/
  # RWO volume — two mariadb pods overlapping on it during a rollout would
  # both try to own the same InnoDB files.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vanilla-wow-mariadb
  template:
    metadata:
      labels:
        app: vanilla-wow-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vanilla-wow-db
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          __DB_SOURCE__
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: __NAMESPACE__
spec:
  selector:
    app: vanilla-wow-mariadb
  ports:
    - port: 3306
      targetPort: 3306

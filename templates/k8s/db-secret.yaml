# The MariaDB root password, consumed via secretKeyRef by mariadb.yaml and
# db-init-job.yaml so it never sits as a plain `value:` in a pod spec (which
# anyone with `get pods -o yaml` could read). Rendered by run-k8s from
# DB_PASS; base64 (a plain `data:` entry) so no YAML quoting is needed.
apiVersion: v1
kind: Secret
metadata:
  name: vanilla-wow-db
  namespace: __NAMESPACE__
type: Opaque
data:
  password: __DB_PASS_B64__

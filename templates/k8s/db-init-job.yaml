apiVersion: batch/v1
kind: Job
metadata:
  name: vanilla-wow-db-init
  namespace: __NAMESPACE__
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: mariadb:11
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vanilla-wow-db
                  key: password
            - name: REALM_ID
              value: "__REALM_ID__"
            - name: REALM_NAME
              value: "__REALM_NAME__"
            - name: REALM_ADDRESS
              value: "__REALM_ADDRESS__"
            - name: WORLD_PORT
              value: "__WORLD_PORT__"
            - name: CLIENT_BUILD
              value: "__CLIENT_BUILD__"
            # The Custom scripts the operator actually selected, comma- or
            # space-separated basenames without .sql — the same CUSTOM_SQL
            # 'configure' uses. Empty means apply none.
            - name: CUSTOM_SQL
              value: "__CUSTOM_SQL__"
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          # lib/bootstrap.sh — the same bootstrap 'configure' runs — behind
          # templates/k8s/db-init.sh, which plugs it into this container's
          # mariadb client. Both come from the vanilla-wow-db-init ConfigMap
          # run-k8s creates. This used to be a second copy of the bootstrap,
          # inlined here, and the two had drifted.
          #
          # Idempotent through realmd.nordrassil_applied: run-k8s deletes and
          # recreates this Job on every deploy (its pod template is
          # immutable), and each import is skipped once recorded.
          command: ["bash", "/bootstrap/db-init.sh"]
      volumes:
        - name: bootstrap
          configMap:
            name: vanilla-wow-db-init
        - name: sql
          hostPath:
            path: __SQL_HOSTPATH__
            type: Directory
